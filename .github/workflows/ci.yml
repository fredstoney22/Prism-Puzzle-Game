name: CI

on:
  push:
    branches: [app-template-cursor, main]
  pull_request:
    branches: [app-template-cursor, main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, unit tests, and build
    # Pinned: Playwright 1.58.2 does not support ubuntu-latest (26.04). Revisit when Playwright is upgraded.
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: .

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test:unit

      - name: Build
        run: npm run build -w @flip/app
        env:
          BETTER_AUTH_SECRET: ci-build-secret-not-for-production-use-only
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/boilerplate
          STRIPE_SECRET_KEY: sk_test_placeholder_for_ci_build
          STRIPE_PRO_PRICE_ID: price_placeholder_for_ci_build

  e2e:
    name: Playwright smoke tests
    # Pinned: Playwright 1.58.2 does not support ubuntu-latest (26.04). Revisit when Playwright is upgraded.
    runs-on: ubuntu-24.04
    needs: quality
    defaults:
      run:
        working-directory: .

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: boilerplate
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d boilerplate"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/boilerplate
      BETTER_AUTH_SECRET: playwright-test-secret-not-for-production
      STRIPE_SECRET_KEY: sk_test_placeholder_for_ci_build
      STRIPE_PRO_PRICE_ID: price_placeholder_for_ci_build
      STRIPE_WEBHOOK_SECRET: whsec_placeholder_for_ci_build

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Prepare database
        run: |
          npm run db:push
          npm run db:seed:all

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        working-directory: apps/app

      - name: Run Playwright tests
        run: npm test
        env:
          CI: true

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/app/playwright-report/
          retention-days: 7
